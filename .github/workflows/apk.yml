# Fabrica el archivo instalable de la app para Android (APK) y lo publica en
# "Releases" del repositorio, para descargarlo desde el celular:
#   https://github.com/LeonardoQrg/Fluxus/releases/latest/download/fluxus.apk
name: App Android

on:
  workflow_dispatch:
  push:
    branches: [claude/fluxus-android-build-vvs07k]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'tests/**'
      - 'tools/**'
      - 'sitio/**'
      - 'play-build.txt'
      - '.github/workflows/play.yml'
      - '.github/workflows/sitio.yml'
      - '.github/workflows/pruebas.yml'

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - name: Generar el proyecto Android
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1
      - name: Compilar
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
        env:
          NODE_ENV: production
      - name: Guardar el archivo (descarga de respaldo)
        uses: actions/upload-artifact@v4
        with:
          name: fluxus-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
      - name: Publicar
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk fluxus.apk
          gh release create "app-${{ github.run_number }}" fluxus.apk \
            --target "${{ github.sha }}" \
            --title "Fluxus (versión de prueba ${{ github.run_number }})" \
            --notes "App para instalar en Android. Commit ${{ github.sha }}." \
            --latest
