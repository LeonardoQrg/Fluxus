# Publica la carpeta sitio/ (política de privacidad, etc.) en GitHub Pages:
#   https://leonardoqrg.github.io/Fluxus/privacidad.html
# Se publica solo cuando cambia algo dentro de sitio/.
# Requiere activar una vez: Settings → Pages → Source: "GitHub Actions".
name: Sitio web

on:
  workflow_dispatch:
  push:
    branches: [claude/fluxus-android-build-vvs07k]
    paths: ['sitio/**', '.github/workflows/sitio.yml']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sitio
      - id: deployment
        uses: actions/deploy-pages@v4
