# Publica la carpeta sitio/ (política de privacidad, etc.) en GitHub Pages:
#   https://leonardoqrg.github.io/Fluxus/privacidad.html
# Se ejecuta a mano (Actions → "Sitio web" → Run workflow) cuando el contenido está listo.
# Requiere activar una vez: Settings → Pages → Source: "GitHub Actions".
name: Sitio web

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sitio
      - id: deployment
        uses: actions/deploy-pages@v4
